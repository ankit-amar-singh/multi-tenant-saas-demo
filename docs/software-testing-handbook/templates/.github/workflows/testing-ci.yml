name: Automated Software Quality & Testing Matrix CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  static-analysis-and-sast:
    name: 🛡️ SAST & Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Typecheck & Linter
        run: pnpm run typecheck
      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  unit-and-integration-tests:
    name: ⚡ Vitest & Supertest Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run API Unit & Integration Tests
        run: pnpm --filter api test

  e2e-and-accessibility-tests:
    name: 🎭 Playwright E2E & WCAG a11y Audit
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Install Dependencies & Playwright Browsers
        run: |
          pnpm install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        run: npx playwright test
      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
